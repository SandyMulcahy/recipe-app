<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9431F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RecipeTap">
<title>RecipeTap</title>
<style>
/* ---------- palette ---------- */
:root{
  --bg:        #A9431F;   /* terracotta */
  --bg-deep:   #8E3617;   /* pressed / recessed */
  --bg-lift:   #BC5330;   /* raised surfaces */
  --line:      rgba(255,255,255,.24);
  --line-soft: rgba(255,255,255,.13);
  --text:      #ffffff;
  --muted:     rgba(255,255,255,.66);
  --faint:     rgba(255,255,255,.42);
  --pad:       22px;

  /* type — content sizes are 2x the original, small caps labels ~1.4x
     so the headers still fit across a phone. Tune here, not inline. */
  --t-base:    20px;
  --t-label:   17px;   /* uppercase section labels */
  --t-chrome:  18px;   /* top bar buttons + crumbs */
  --t-ing:     34px;   /* ingredient lines in the reader */
  --t-ins:     38px;   /* instruction text in the reader */
  --t-rowname: 32px;   /* recipe name in the browse list */
  --t-rowmeta: 20px;
  --t-wordmark:76px;
  --t-tab:     34px;
  --t-tabsub:  22px;
  --t-input:   22px;
  --t-title:   34px;
  --t-primary: 28px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:var(--t-base);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}

/* ---------- screen shell ---------- */
#app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

.topbar{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px var(--pad);
  border-bottom:1px solid var(--line-soft);
}
.topbar .crumb{
  font-size:var(--t-chrome);
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  white-space:nowrap;
}
.txtbtn{
  font-size:var(--t-chrome);
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--muted);
  padding:8px 2px;
  white-space:nowrap;
  transition:color .12s;
}
.txtbtn:active{color:var(--text)}
.txtbtn.on{color:var(--text)}

.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- menu ---------- */
.menu{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:var(--pad);
  gap:16px;
}
.wordmark{
  font-size:var(--t-wordmark);
  font-weight:700;
  letter-spacing:-.03em;
  line-height:1;
  margin-bottom:22px;
}
.tab{
  display:block;
  width:100%;
  text-align:left;
  padding:30px 24px;
  background:var(--bg-lift);
  border:1px solid var(--line);
  border-radius:16px;
  font-size:var(--t-tab);
  font-weight:600;
  line-height:1.15;
  transition:background .12s,transform .12s;
}
.tab:active{background:var(--bg-deep);transform:scale(.985)}
.tab small{display:block;font-size:var(--t-tabsub);font-weight:400;color:var(--muted);margin-top:9px;line-height:1.3}

/* ---------- browse ---------- */
.search{
  flex:none;
  padding:14px var(--pad);
  border-bottom:1px solid var(--line-soft);
}
.search input{
  display:block;
  width:100%;
  font-size:var(--t-input);
  padding:14px 16px;
  background:var(--bg-deep);
  border:1px solid var(--line);
  border-radius:12px;
}
.search input::placeholder{color:rgba(255,255,255,.4)}
.search input:focus{border-color:#fff}

.list{padding:6px 0 40px}
.row{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  text-align:left;
  padding:22px var(--pad);
  border-bottom:1px solid var(--line-soft);
  transition:background .12s;
}
.row:active{background:var(--bg-deep)}
.row .name{flex:1;min-width:0;font-size:var(--t-rowname);font-weight:600;line-height:1.2}
.row .meta{display:block;font-size:var(--t-rowmeta);color:var(--muted);margin-top:6px;font-weight:400}
.row .del{
  flex:none;
  font-size:var(--t-chrome);
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--muted);
  padding:12px 4px 12px 14px;
}
.empty{padding:56px var(--pad);color:var(--muted);text-align:center;font-size:var(--t-input);line-height:1.6}

/* ---------- reader ---------- */
.reader{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;user-select:none}
.reader .rbar{
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px var(--pad);
}
.reader .rtitle{
  font-size:var(--t-chrome);
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  min-width:0;
}
.reader .count{font-size:var(--t-chrome);letter-spacing:.08em;color:var(--muted);flex:none}

.ing{
  flex:none;
  /* generous gap between the top bar and the first ingredient */
  padding:46px var(--pad) 34px;
  border-bottom:1px solid var(--line);
  max-height:46%;
  overflow-y:auto;
}
.ing h2, .ins h2{
  font-size:var(--t-label);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--faint);
  margin-bottom:20px;
  font-weight:600;
}
.ing ul{list-style:none}
.ing li{font-size:var(--t-ing);font-weight:600;line-height:1.25;padding:8px 0}
.ing .none{color:var(--muted);font-size:var(--t-input);font-weight:400}

.ins{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:34px var(--pad) 34px;
  /* short steps sit in the middle of the page; long ones flow from the top
     without being clipped ("safe" stops centring once content overflows) */
  display:flex;
  flex-direction:column;
  justify-content:center;
  justify-content:safe center;
}
.ins > *{flex:none}
.ins p{font-size:var(--t-ins);line-height:1.35;white-space:pre-wrap}

.progress{flex:none;height:2px;background:var(--line-soft)}
.progress i{display:block;height:100%;background:#fff;transition:width .18s ease}

/* ---------- add form ---------- */
.form{padding:var(--pad) var(--pad) 40px}
.field{margin-bottom:26px}
.field label{
  display:block;
  font-size:var(--t-label);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--faint);
  margin-bottom:11px;
  font-weight:600;
}
.field input, .field textarea{
  display:block;
  width:100%;
  font-size:var(--t-input);
  line-height:1.4;
  padding:14px 16px;
  background:var(--bg-deep);
  border:1px solid var(--line);
  border-radius:12px;
  resize:none;
}
.field input::placeholder, .field textarea::placeholder{color:rgba(255,255,255,.35)}
.field input:focus, .field textarea:focus{border-color:#fff}
.field input.title{font-size:var(--t-title);font-weight:600;padding:16px}

.card{
  background:var(--bg-lift);
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
}
.card .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.card .cnum{
  font-size:var(--t-label);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}
.card .field:last-child{margin-bottom:0}
.card .field input, .card .field textarea{background:var(--bg-deep)}

.addstep{
  display:block;
  width:100%;
  padding:22px;
  border:1px dashed var(--line);
  border-radius:16px;
  font-size:var(--t-primary);
  color:var(--muted);
  margin-bottom:26px;
}
.addstep:active{color:var(--text);border-color:#fff}

.primary{
  display:block;
  width:100%;
  padding:22px;
  background:#fff;
  color:var(--bg);
  border-radius:14px;
  font-size:var(--t-primary);
  font-weight:700;
}
.primary:active{opacity:.82}
.primary[disabled]{opacity:.45}

.note{margin-top:18px;color:var(--muted);font-size:var(--t-input);line-height:1.55}
.err{
  margin-bottom:20px;
  padding:16px 18px;
  border:1px solid #fff;
  border-radius:12px;
  font-size:var(--t-input);
  line-height:1.5;
  word-break:break-word;
}

/* ---------- password overlay ---------- */
.overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:50;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:var(--pad);
  padding-bottom:calc(var(--pad) + env(safe-area-inset-bottom));
  overflow-y:auto;
}
.overlay h2{font-size:var(--t-title);font-weight:700;margin-bottom:12px;text-transform:none;letter-spacing:0;color:var(--text)}
.overlay p.lede{color:var(--muted);font-size:var(--t-input);line-height:1.5;margin-bottom:26px}
.overlay .row2{display:flex;gap:12px;margin-top:16px}
.overlay .row2 .primary{flex:1}
.ghost{
  flex:none;
  padding:22px 26px;
  border:1px solid var(--line);
  border-radius:14px;
  font-size:var(--t-primary);
  color:var(--muted);
}
.ghost:active{color:var(--text);border-color:#fff}

/* ---------- setup ---------- */
.setup{padding:var(--pad);flex:1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.setup h1{font-size:var(--t-title);font-weight:700;margin-bottom:12px}
.setup .lede{color:var(--muted);font-size:var(--t-input);line-height:1.55;margin-bottom:28px}
.setup code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.85em;
  background:var(--bg-deep);
  padding:2px 6px;
  border-radius:5px;
}

.center{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:var(--t-chrome);letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =====================================================================
   CONFIG
   ===================================================================== */
var BUILTIN_URL = "https://ezayeozsnsvvboxpkrkf.supabase.co";
var BUILTIN_KEY = "sb_publishable_oeW3loG2fhYXn9sRQHtPqA_Qx414rk-";

var CFG_KEY = "recipes.supabase.v1";
var CFG = null;

function loadCfg(){
  if (BUILTIN_URL && BUILTIN_KEY) { CFG = {url:BUILTIN_URL.replace(/\/+$/,""), key:BUILTIN_KEY}; return; }
  try { CFG = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); } catch(e){ CFG = null; }
}
function saveCfg(url, key){
  CFG = {url:url.replace(/\/+$/,""), key:key};
  try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch(e){}
}

/* ---------- Supabase REST (no SDK, plain fetch) ---------- */
function api(path, opts){
  opts = opts || {};
  var headers = {
    "apikey": CFG.key,
    "Content-Type": "application/json"
  };
  /* Legacy anon keys are JWTs and may also go in Authorization. The newer
     sb_publishable_ keys are not, and Supabase rejects them there with
     "Invalid JWT" — so only add the Bearer header for a real JWT. */
  if (CFG.key.indexOf("ey") === 0) headers["Authorization"] = "Bearer " + CFG.key;
  if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];

  return fetch(CFG.url + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body
  }).then(function(r){
    return r.text().then(function(t){
      if (!r.ok){
        var msg = t;
        try { var j = JSON.parse(t); msg = j.message || j.hint || t; } catch(e){}
        var err = new Error(msg || ("HTTP " + r.status));
        err.status = r.status;
        err.raw = t;
        throw err;
      }
      return t ? JSON.parse(t) : null;
    });
  });
}
function rpc(name, body){
  return api("rpc/" + name, {method:"POST", body: JSON.stringify(body || {})});
}

var fetchRecipes = function(){
  return api("recipes?select=id,title,steps&order=created_at.desc");
};
var createRecipe = function(title, steps){
  return api("recipes", {
    method: "POST",
    headers: {"Prefer":"return=representation"},
    body: JSON.stringify({title:title, steps:steps})
  });
};
/* Deletion is NOT a direct DELETE — the anon role has no delete permission on
   the table. It goes through a database function that verifies the password
   against a bcrypt hash the anon key cannot read. */
var deleteRecipe = function(pw, id){
  return rpc("delete_recipe", {pw:pw, rid:id});
};
var checkPassword = function(pw){
  return rpc("check_manage_password", {pw:pw});
};

function notSetUp(e){
  /* PGRST202 = function not found in schema cache */
  return e && (e.status === 404 || /PGRST202|Could not find the function|schema cache/i.test(e.raw || e.message || ""));
}

/* =====================================================================
   STATE
   ===================================================================== */
var S = {
  screen: "menu",      // setup | menu | browse | reader | add
  recipes: null,
  loading: false,
  error: "",
  q: "",
  manage: false,
  pw: null,            // in memory only, cleared on reload
  pwPrompt: false,
  pwErr: "",
  pwBusy: false,
  recipe: null,
  step: 0,
  draft: null,
  saving: false
};

function newDraft(){ return { title:"", steps:[{ing:"", ins:""}] }; }

function go(screen){
  S.screen = screen;
  S.error = "";
  render();
  var b = document.querySelector(".body");
  if (b) b.scrollTop = 0;
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function lines(s){
  return String(s || "").split("\n")
    .map(function(x){ return x.trim(); })
    .filter(function(x){ return x.length; });
}
var app = document.getElementById("app");

/* search matches the recipe name and anything written in its steps */
function haystack(r){
  var parts = [r.title];
  (r.steps || []).forEach(function(s){ parts.push(s.ing || "", s.ins || ""); });
  return parts.join(" ").toLowerCase();
}
function filtered(){
  var q = S.q.trim().toLowerCase();
  if (!q) return S.recipes || [];
  return (S.recipes || []).filter(function(r){ return haystack(r).indexOf(q) !== -1; });
}

/* =====================================================================
   SCREENS
   ===================================================================== */
function viewSetup(){
  return '' +
  '<div class="screen"><div class="setup">' +
    '<h1>One-time setup</h1>' +
    '<p class="lede">Paste your Supabase project URL and publishable key. They are stored on this device only. See <code>SETUP.md</code> for the SQL to run first.</p>' +
    (S.error ? '<div class="err">' + esc(S.error) + '</div>' : '') +
    '<div class="field"><label>Project URL</label>' +
      '<input id="su-url" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://yourproject.supabase.co" value="' + esc(CFG ? CFG.url : "") + '"></div>' +
    '<div class="field"><label>Publishable key</label>' +
      '<textarea id="su-key" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sb_publishable_...">' + esc(CFG ? CFG.key : "") + '</textarea></div>' +
    '<button class="primary" id="su-save"' + (S.loading ? " disabled" : "") + '>' + (S.loading ? "Checking" : "Connect") + '</button>' +
  '</div></div>';
}

function viewMenu(){
  return '' +
  '<div class="screen"><div class="menu">' +
    '<div class="wordmark">RecipeTap</div>' +
    '<button class="tab" data-go="browse">Browse recipes<small>Pick something to cook</small></button>' +
    '<button class="tab" data-go="add">Add new recipe<small>Build it step by step</small></button>' +
  '</div></div>';
}

/* the list is rendered on its own so typing in the search box never
   replaces the input and steals focus from the keyboard */
function listHtml(){
  if (S.error){
    return '<div class="empty"><div class="err">' + esc(S.error) + '</div><button class="txtbtn" id="retry">Try again</button></div>';
  }
  if (S.recipes === null) return '<div class="center">Loading</div>';
  if (!S.recipes.length) return '<div class="empty">No recipes yet.<br>Add one from the menu.</div>';

  var rows = filtered();
  if (!rows.length) return '<div class="empty">Nothing matches &ldquo;' + esc(S.q.trim()) + '&rdquo;</div>';

  return '<div class="list">' + rows.map(function(r){
    var n = (r.steps || []).length;
    return '<button class="row" data-open="' + esc(r.id) + '">' +
      '<span class="name">' + esc(r.title) +
        '<span class="meta">' + n + (n === 1 ? " step" : " steps") + '</span>' +
      '</span>' +
      (S.manage ? '<span class="del" data-del="' + esc(r.id) + '">Delete</span>' : '') +
    '</button>';
  }).join("") + '</div>';
}

function viewBrowse(){
  return '' +
  '<div class="screen">' +
    '<div class="topbar">' +
      '<button class="txtbtn" data-go="menu">Menu</button>' +
      '<div class="crumb">Browse</div>' +
      '<button class="txtbtn' + (S.manage ? " on" : "") + '" id="manage">' + (S.manage ? "Done" : "Manage") + '</button>' +
    '</div>' +
    '<div class="search"><input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search recipes" value="' + esc(S.q) + '"></div>' +
    '<div class="body" id="listwrap">' + listHtml() + '</div>' +
  '</div>' +
  (S.pwPrompt ? viewPwPrompt() : "");
}

function viewPwPrompt(){
  return '' +
  '<div class="overlay" id="pwoverlay">' +
    '<h2>Manage recipes</h2>' +
    '<p class="lede">Enter the password to unlock deleting.</p>' +
    (S.pwErr ? '<div class="err">' + esc(S.pwErr) + '</div>' : '') +
    '<div class="field"><label>Password</label>' +
      '<input id="pwinput" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false"></div>' +
    '<div class="row2">' +
      '<button class="primary" id="pwgo"' + (S.pwBusy ? " disabled" : "") + '>' + (S.pwBusy ? "Checking" : "Unlock") + '</button>' +
      '<button class="ghost" id="pwcancel">Cancel</button>' +
    '</div>' +
  '</div>';
}

function viewReader(){
  var r = S.recipe;
  var steps = r.steps || [];
  var total = steps.length || 1;
  var i = Math.max(0, Math.min(S.step, total - 1));
  var st = steps[i] || {ing:"", ins:""};
  var ing = lines(st.ing);

  var ingHtml = ing.length
    ? '<ul>' + ing.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>'
    : '<div class="none">Nothing new for this step</div>';

  return '' +
  '<div class="screen reader" id="reader">' +
    '<div class="rbar">' +
      '<button class="txtbtn" data-nohit data-go="browse">Back</button>' +
      '<div class="rtitle">' + esc(r.title) + '</div>' +
      '<div class="count">' + (i + 1) + ' / ' + total + '</div>' +
    '</div>' +
    '<div class="progress"><i style="width:' + Math.round(((i + 1) / total) * 100) + '%"></i></div>' +
    '<div class="ing"><h2>Ingredients</h2>' + ingHtml + '</div>' +
    '<div class="ins"><h2>Step ' + (i + 1) + '</h2><p>' + esc(st.ins || "") + '</p></div>' +
  '</div>';
}

function viewAdd(){
  var d = S.draft;
  var cards = d.steps.map(function(s, i){
    return '<div class="card">' +
      '<div class="chead"><div class="cnum">Step ' + (i + 1) + '</div>' +
        (d.steps.length > 1 ? '<button class="txtbtn" data-rm="' + i + '">Remove</button>' : '') +
      '</div>' +
      '<div class="field"><label>Ingredients</label>' +
        '<textarea rows="3" data-f="ing" data-i="' + i + '" placeholder="One per line">' + esc(s.ing) + '</textarea></div>' +
      '<div class="field"><label>Instructions</label>' +
        '<textarea rows="4" data-f="ins" data-i="' + i + '" placeholder="What to do">' + esc(s.ins) + '</textarea></div>' +
    '</div>';
  }).join("");

  return '' +
  '<div class="screen">' +
    '<div class="topbar">' +
      '<button class="txtbtn" data-go="menu">Cancel</button>' +
      '<div class="crumb">New recipe</div>' +
      '<span class="txtbtn" style="visibility:hidden">Menu</span>' +
    '</div>' +
    '<div class="body"><div class="form">' +
      (S.error ? '<div class="err">' + esc(S.error) + '</div>' : '') +
      '<div class="field"><label>Recipe name</label>' +
        '<input class="title" id="d-title" type="text" placeholder="Untitled recipe" value="' + esc(d.title) + '"></div>' +
      cards +
      '<button class="addstep" id="addstep">Add step</button>' +
      '<button class="primary" id="save"' + (S.saving ? " disabled" : "") + '>' + (S.saving ? "Saving" : "Save recipe") + '</button>' +
      '<div class="note">Each card is one screen while you cook. Put only the ingredients you need for that step at the top.</div>' +
    '</div></div>' +
  '</div>';
}

function render(){
  var html;
  if (S.screen === "setup")       html = viewSetup();
  else if (S.screen === "menu")   html = viewMenu();
  else if (S.screen === "browse") html = viewBrowse();
  else if (S.screen === "reader") html = viewReader();
  else if (S.screen === "add")    html = viewAdd();
  else html = viewMenu();
  app.innerHTML = html;
  autosize();
  var pi = document.getElementById("pwinput");
  if (pi) pi.focus();
}

function renderList(){
  var w = document.getElementById("listwrap");
  if (w) w.innerHTML = listHtml();
}

function autosize(){
  var ts = app.querySelectorAll("textarea[data-f]");
  for (var i = 0; i < ts.length; i++){
    var t = ts[i];
    t.style.height = "auto";
    t.style.height = (t.scrollHeight + 2) + "px";
  }
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function syncDraftFromDom(){
  if (!S.draft) return;
  var t = document.getElementById("d-title");
  if (t) S.draft.title = t.value;
  var ts = app.querySelectorAll("textarea[data-f]");
  for (var i = 0; i < ts.length; i++){
    var el = ts[i];
    var idx = parseInt(el.getAttribute("data-i"), 10);
    if (S.draft.steps[idx]) S.draft.steps[idx][el.getAttribute("data-f")] = el.value;
  }
}

function loadList(){
  S.recipes = null;
  S.error = "";
  if (S.screen === "browse") renderList(); else render();
  fetchRecipes().then(function(rows){
    S.recipes = (rows || []).map(function(r){
      return {id:r.id, title:r.title, steps: Array.isArray(r.steps) ? r.steps : []};
    });
    renderList();
  }).catch(function(e){
    S.error = "Could not reach the database. " + e.message;
    S.recipes = [];
    renderList();
  });
}

app.addEventListener("input", function(e){
  var el = e.target;
  if (el.id === "q"){
    S.q = el.value;
    renderList();          // list only — the input keeps focus
    return;
  }
  if (el.hasAttribute && el.hasAttribute("data-f")){
    var idx = parseInt(el.getAttribute("data-i"), 10);
    if (S.draft && S.draft.steps[idx]) S.draft.steps[idx][el.getAttribute("data-f")] = el.value;
    el.style.height = "auto";
    el.style.height = (el.scrollHeight + 2) + "px";
  } else if (el.id === "d-title" && S.draft){
    S.draft.title = el.value;
  }
});

/* Enter submits the password prompt */
app.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target.id === "pwinput"){ e.preventDefault(); submitPassword(); }
});

function submitPassword(){
  var el = document.getElementById("pwinput");
  var pw = el ? el.value : "";
  if (!pw){ S.pwErr = "Enter the password."; render(); return; }
  S.pwBusy = true; S.pwErr = ""; render();
  var input = document.getElementById("pwinput");
  if (input) input.value = pw;

  checkPassword(pw).then(function(okv){
    S.pwBusy = false;
    if (okv === true){
      S.pw = pw;
      S.manage = true;
      S.pwPrompt = false;
      S.pwErr = "";
    } else {
      S.pwErr = "Wrong password.";
    }
    render();
  }).catch(function(e){
    S.pwBusy = false;
    S.pwErr = notSetUp(e)
      ? "The manage password has not been set up yet. Run the second SQL block in SETUP.md."
      : "Could not check the password. " + e.message;
    render();
  });
}

app.addEventListener("click", function(e){
  var t = e.target;

  /* --- password overlay (sits above everything, handle first) --- */
  if (t.id === "pwgo"){ submitPassword(); return; }
  if (t.id === "pwcancel"){ S.pwPrompt = false; S.pwErr = ""; render(); return; }
  if (S.pwPrompt && t.closest("#pwoverlay")) return;

  var goEl = t.closest("[data-go]");
  if (goEl){
    var dest = goEl.getAttribute("data-go");
    if (dest === "browse"){ S.q = ""; go("browse"); loadList(); return; }
    if (dest === "add"){ S.draft = newDraft(); go("add"); return; }
    go(dest);
    return;
  }

  /* --- setup --- */
  if (t.id === "su-save"){
    var u = (document.getElementById("su-url").value || "").trim().replace(/\/+$/,"");
    var k = (document.getElementById("su-key").value || "").trim();
    if (!u || !k){ S.error = "Both fields are required."; render(); return; }
    S.loading = true; S.error = ""; render();
    var tmp = CFG; CFG = {url:u, key:k};
    fetchRecipes().then(function(){
      saveCfg(u, k);
      S.loading = false;
      go("menu");
    }).catch(function(err){
      CFG = tmp;
      S.loading = false;
      S.error = "Could not connect. Check the URL, the key, and that the recipes table exists. " + err.message;
      render();
    });
    return;
  }

  /* --- browse --- */
  if (t.id === "manage"){
    if (S.manage){ S.manage = false; render(); return; }
    if (S.pw){ S.manage = true; render(); return; }
    S.pwPrompt = true; S.pwErr = ""; render();
    return;
  }
  if (t.id === "retry"){ loadList(); return; }

  var delEl = t.closest("[data-del]");
  if (delEl){
    e.stopPropagation();
    var did = delEl.getAttribute("data-del");
    var rec = (S.recipes || []).filter(function(r){ return r.id === did; })[0];
    if (!confirm('Delete "' + (rec ? rec.title : "this recipe") + '"?')) return;
    var keep = S.recipes;
    S.recipes = S.recipes.filter(function(r){ return r.id !== did; });
    renderList();
    deleteRecipe(S.pw, did).catch(function(err){
      S.recipes = keep;
      S.error = notSetUp(err)
        ? "Deleting needs the SQL in SETUP.md to be run first."
        : "Delete failed. " + err.message;
      renderList();
    });
    return;
  }

  var openEl = t.closest("[data-open]");
  if (openEl){
    var oid = openEl.getAttribute("data-open");
    var r = (S.recipes || []).filter(function(x){ return x.id === oid; })[0];
    if (!r) return;
    if (!r.steps.length){ alert("This recipe has no steps yet."); return; }
    S.recipe = r; S.step = 0;
    go("reader");
    return;
  }

  /* --- add --- */
  if (t.id === "addstep"){
    syncDraftFromDom();
    S.draft.steps.push({ing:"", ins:""});
    render();
    var b = document.querySelector(".body");
    if (b) b.scrollTop = b.scrollHeight;
    return;
  }
  var rmEl = t.closest("[data-rm]");
  if (rmEl){
    syncDraftFromDom();
    S.draft.steps.splice(parseInt(rmEl.getAttribute("data-rm"), 10), 1);
    render();
    return;
  }
  if (t.id === "save"){
    syncDraftFromDom();
    var d = S.draft;
    var title = (d.title || "").trim();
    var steps = d.steps
      .map(function(s){ return {ing:(s.ing || "").trim(), ins:(s.ins || "").trim()}; })
      .filter(function(s){ return s.ing || s.ins; });
    if (!title){ S.error = "Give the recipe a name."; render(); return; }
    if (!steps.length){ S.error = "Add at least one step."; render(); return; }
    S.saving = true; S.error = ""; render();
    createRecipe(title, steps).then(function(){
      S.saving = false;
      S.draft = null;
      S.q = "";
      go("browse");
      loadList();
    }).catch(function(err){
      S.saving = false;
      S.error = "Could not save. " + err.message;
      render();
    });
    return;
  }

  /* --- reader: tap left 35% to go back, anywhere right of that to advance ---
     This lives at the tail of the same listener on purpose: every branch above
     returns, so a tap that opened the reader can never also turn its first page. */
  if (S.screen === "reader"){
    if (t.closest("[data-nohit]")) return;
    var rd = document.getElementById("reader");
    if (!rd) return;
    var rect = rd.getBoundingClientRect();
    var x = (e.clientX != null ? e.clientX : rect.left + rect.width / 2) - rect.left;
    step(x < rect.width * 0.35 ? -1 : 1);
  }
});

function step(dir){
  var total = (S.recipe.steps || []).length;
  var next = S.step + dir;
  if (next < 0){ S.step = 0; return; }
  if (next > total - 1) return;
  S.step = next;
  render();
}

document.addEventListener("keydown", function(e){
  if (S.screen !== "reader") return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); step(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "Escape") go("browse");
});

document.addEventListener("dblclick", function(e){
  if (S.screen === "reader") e.preventDefault();
});

/* =====================================================================
   BOOT
   ===================================================================== */
loadCfg();
S.screen = (CFG && CFG.url && CFG.key) ? "menu" : "setup";
render();
</script>
</body>
</html>
